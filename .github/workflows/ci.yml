name: Manual validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Static and procedural checks
        run: npm run check
      - name: Build
        run: npm run build
      - name: Preview smoke test
        run: |
          npm run preview > /tmp/motera-preview.log 2>&1 &
          PID=$!
          trap "kill $PID 2>/dev/null || true" EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ | grep -q "Motera 3D"; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/motera-preview.log
          exit 1
